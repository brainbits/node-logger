name: Release and Publish Packages

on:
    push:
        branches:
            - '**'
        tags:
            - v*

jobs:
    test:
        name: Run unit tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install node dependencies
              run: npm ci
            - name: Run code-style
              run: npm run check:code-style -ws
            - name: Run tests
              run: npm test -ws

    release:
        name: Create release and publish
        needs: test
        if: github.repository == 'brainbits/node-logger' && github.ref_type == 'tag'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
            - name: Install node dependencies
              run: npm ci
            - name: Build
              run: npm run build -ws
            - name: Check that the tag matches the package version
              run: test "${{ github.ref_name }}" = "v$(node -p "require('./package.json').version")"
            - name: Publish packages
              env:
                  NODE_AUTH_TOKEN: ${{secrets.npm_token}}
              run: npm publish --workspaces
